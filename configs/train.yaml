seed: 42

device: cuda
batch_size: 32
epochs: 40
learning_rate: 0.001
weight_decay: 0.0001
lr_decay_factor: 0.5

num_workers: 4
pin_memory: true

optimizer: adam
scheduler: step
criterion: cross_entropy

save_best_only: true
checkpoint_dir: artifacts/checkpoints
metrics_dir: artifacts/metrics
plots_dir: artifacts/plots
predictions_dir: artifacts/predictions

model_config: configs/model/citrusnet_v2.yaml